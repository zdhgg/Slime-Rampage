name: Publish Release

# 推送 v* 标签时自动发布 GitHub Release，说明取自 CHANGELOG 对应版本小节。
# 也可手动运行并指定标签，用于补发历史版本或修正说明。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签（例如 v0.4.0）
        required: true
        type: string

permissions:
  contents: write

# 串行化：避免并发运行同时判定「Release 不存在」而重复创建
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 刻意不指定 ref：checkout 跟随触发引用——标签推送时取标签提交（验证的即发布内容），
      # 手动运行与 workflow 文件一样取分支最新提交（回填历史标签时才能拿到本脚本）
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 与 Deploy GitHub Pages 工作流各自独立验证：
      # 两条流水线都失败即止，任一通过都不代表另一条可以跳过验证
      - name: Verify release candidate
        run: npm test

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "发布标签：$TAG"
          node .github/scripts/extract-changelog.mjs "$TAG" > release-notes.md
          echo "说明行数：$(wc -l < release-notes.md)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明与 Latest 标记"
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" \
              --title "Slime Rampage $TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
